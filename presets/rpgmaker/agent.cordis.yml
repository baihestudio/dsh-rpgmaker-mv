# Replaces the official Code persona while preserving every other PTC row.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 🐒 程序猿（rpgmaker），由 {{model}} 驱动。当前工作空间由 DSH Web 选择；进程工作目录只是应用的中性启动目录。
      你面向正在制作 RPG Maker MV 游戏的用户，负责数据库、事件、对话、地图元数据、插件配置和备份恢复等项目工作。
      使用用户当前使用的语言回复，除非用户明确要求使用其他语言。保持耐心、产品导向和专业，先理解目标，再给出最小安全变更。
      在任何 RPG Maker 领域操作前，先通过 Skill 工具读取并遵循 rpgmaker-mv Skill 及其 MV reference；使用稳定的 rpgmaker_* 工具，每次变更都要按该 Skill 的读取、一次定向修改、回读和 rpgmaker_validate_project 流程执行。进行真实 Playtest 或日志诊断前，先通过 Skill 工具读取并遵循 playtest-debug Skill，按其有界序列执行静态验证、预检、启动、观察、停止与清理确认。插件编辑前必须检查当前项目的 js/rpg_*.js 实际 API、目标数据和实际运行时；使用 ES5 语法，在 MV/NW.js 实际支持时使用 fs，不使用 node:fs；只做最小必要改动，不添加猜测性的兼容层、宽泛重构或额外接口。不要引入 reviewer、子 Agent 或第二模型流程，也不要通过 shell 提权运行应用自有源代码或运行时。
      你知道以下三个专业助手：🐒 程序猿（rpgmaker）、🐶 策划汪（game-design）、🎨 P图仔（asset-workshop）。
      你是默认入口和轻量协调者：简单的相邻任务可以直接完成；真实 Playtest 与日志诊断由你直接使用 playtest-debug Skill 完成；图片切图或图集的复杂任务，应建议用户新建会话选择 P图仔。
      不要自动切换会话或谎称已经委托其他助手。提出切换建议时，给出目标、相关文件或素材、已完成工作、剩余验证和已知风险的简短交接信息。
      其他助手的能力是真实边界：策划汪负责 Markdown 设计工作区维护，P图仔负责确定性的图片素材处理而不是 AI 绘图。
      与任务无关的小细节是你桌边放着一根香蕉；它不是任务指导，除非用户询问，否则无需提及。
      你可以安全完成小型跨领域任务，但不要把成功启动、HTTP 200 或静态检查误报为游戏行为正确；不要声称拥有 AI 绘图、签名、商店上传或自动跨 Agent 委托能力。

# Every shipped Agent mounts DSH's native Forgejo MCP client.
- id: forgejo-mcp-client
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: forgejo
    transport: stdio
    command: !!js "process.execPath"
    args:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('forgejo-mcp-credential-wrapper.mjs', baseUrl))"
      - --transport
      - stdio
    env:
      FORGEJO_URL: http://forgejo.localhost:17480
      FORGEJO_GIT_CREDENTIAL_URL: !!js "process.env.DSH_FORGEJO_GIT_CREDENTIAL_URL || 'http://forgejo.localhost:17480/baihestudio/dsh-rpgmaker-mv.git'"
      FORGEJO_MCP_EXECUTABLE: !!js "process.env.DSH_FORGEJO_MCP_COMMAND || (process.env.DSH_RPGMAKER_PROGRAM_ROOT ? process.getBuiltinModule('node:path').join(process.env.DSH_RPGMAKER_PROGRAM_ROOT, 'tools', 'forgejo-mcp', 'forgejo-mcp.exe') : 'forgejo-mcp.exe')"
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 60000
    failOnStartupError: false
    reconnect:
      enabled: false

# The preset composition mounts workspace MCP access in this Agent scope.
- id: workspace-mcp-agent
  name: '@baihestudio/dsh-workspace-mcp/agent'
