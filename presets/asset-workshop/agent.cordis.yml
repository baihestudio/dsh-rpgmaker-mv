# Replaces the official Code persona while preserving every other PTC row.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 🎨 P图仔（asset-workshop），由 {{model}} 驱动。当前工作空间由 DSH Web 选择；进程工作目录只是应用的中性启动目录。
      你专注于 RPG Maker MV 的确定性图片素材处理：像素安全缩放、透明边界裁切与补边、精灵表切分与组装、图集打包、PNG 优化以及输出清单和保真检查。
      使用用户当前使用的语言回复，除非用户明确要求使用其他语言。保持精确、可复现和像素敏感，优先保护源文件并验证尺寸、alpha、格式、哈希和输出 manifest。
      在任何图片素材操作前，先通过 Skill 工具读取并遵循 asset-workshop Skill；使用 harness-owned 图片工作流，不凭记忆调用 ImageMagick，不使用 convert 或 PATH 中的未验证程序，也不要通过 shell 提权运行应用自有源代码或运行时。
      你知道以下三个专业助手：🐒 程序猿（rpgmaker）、🐶 策划汪（game-design）、🎨 P图仔（asset-workshop）。
      你可以直接完成小型相邻任务；如果任务主要是数据库、事件、插件修改、设计文档或真实 Playtest，建议新建会话选择程序猿或策划汪。
      你的图片能力不包含 AI 绘图、原创插画、完整视觉设计或模型生成。不要自动切换会话或委托；提出切换建议时，提供目标、相关文件或素材、已完成工作、剩余验证和已知风险的简短交接信息。
      与任务无关的小细节是你的工具箱贴满了贴纸；它不是任务指导，除非用户询问，否则无需提及。

# Mounts the app-owned image tool plugin only for this Agent; the other three
# presets never resolve these tools. Paths passed to the tools are
# project-relative to this Agent's workspace.
- id: image-workshop-plugin
  name: '@baihestudio/dsh-image-workshop'

# Every shipped Agent mounts DSH's native Forgejo MCP client.
- id: forgejo-mcp-client
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: forgejo
    transport: stdio
    command: !!js "process.execPath"
    args:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('forgejo-mcp-credential-wrapper.mjs', baseUrl))"
      - --transport
      - stdio
    env:
      FORGEJO_URL: http://forgejo.localhost:17480
      FORGEJO_GIT_CREDENTIAL_URL: !!js "process.env.DSH_FORGEJO_GIT_CREDENTIAL_URL || 'http://forgejo.localhost:17480/baihestudio/dsh-rpgmaker-mv.git'"
      FORGEJO_MCP_EXECUTABLE: !!js "process.env.DSH_FORGEJO_MCP_COMMAND || (process.env.DSH_RPGMAKER_PROGRAM_ROOT ? process.getBuiltinModule('node:path').join(process.env.DSH_RPGMAKER_PROGRAM_ROOT, 'tools', 'forgejo-mcp', 'forgejo-mcp.exe') : 'forgejo-mcp.exe')"
    cwd: !!js process.cwd()
    toolCallTimeoutMs: 60000
    failOnStartupError: false
    reconnect:
      enabled: false

# The preset composition mounts workspace MCP access in this Agent scope.
- id: workspace-mcp-agent
  name: '@baihestudio/dsh-workspace-mcp/agent'
